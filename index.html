<!DOCTYPE html>
<!--
  =====================================================================
  index.html  -  THE PAGE THE BROWSER OPENS
  ---------------------------------------------------------------------
  The questions and wording are NOT in this file. They come from the
  "Questions" and "Settings" tabs of your Google Sheet (see SETUP.md),
  so you edit them there. This file just loads the style and script files.
  =====================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- The title and the "preview card" messaging apps show when the link is shared. Kept vague on purpose. -->
  <title>A little something</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="A little something">
  <meta property="og:description" content="Help me get the details right.">
  <meta property="og:image" content="https://kiruvara.github.io/Bridesmaids/assets/preview.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">

  <!-- Fonts from Google Fonts: "Pinyon Script" (handwriting) and "Cormorant Garamond" (body text). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">

  <!-- OUR STYLE FILES (later files win if two rules clash). -->
  <link rel="stylesheet" href="css/base.css">      <!-- colours, fonts, layout, buttons -->
  <link rel="stylesheet" href="css/page.css">      <!-- header, white sheets, notes -->
  <link rel="stylesheet" href="css/forms.css">     <!-- questions, chips, colour circles -->
  <link rel="stylesheet" href="css/effects.css">   <!-- pop-up message, animations, small screens -->
</head>

<body>
  <!-- Shared colour gradients for the drawings. It has zero size: it only holds definitions. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="gSilver" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#b7bcc5"/><stop offset="1" stop-color="#eceef1"/></linearGradient>
    <linearGradient id="gBow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9c3d1"/><stop offset="1" stop-color="#e58aa5"/></linearGradient>
    <linearGradient id="gCandle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1e3c0"/><stop offset=".45" stop-color="#fffaf0"/><stop offset="1" stop-color="#eadbb5"/></linearGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd98a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity=".7"/><stop offset="1" stop-color="#dfe6ee" stop-opacity=".3"/></linearGradient>
  </defs></svg>

  <noscript><p style="color:#fff;padding:24px;font-family:Georgia,serif">This page needs JavaScript to open. Please try another browser.</p></noscript>

  <!-- THE PAGE LAYOUT: brown tablecloth (the body) > pink runner (id="app"). The JavaScript fills the runner. -->
  <div class="wrap"><div class="runner" id="app"></div></div>

  <!-- THE JAVASCRIPT FILES, in the order they must load (each can use the ones above it). -->
  <script src="config.js"></script>                      <!-- your Google script address -->
  <script src="content/default-content.js"></script>     <!-- built-in questions (a safety net) -->
  <script src="js/utils.js"></script>                    <!-- small helpers -->
  <script src="js/dom.js"></script>                      <!-- tools for building the page -->
  <script src="js/drawings.js"></script>                 <!-- flowers, candle, glass -->
  <script src="js/content.js"></script>                  <!-- gets the questions from your Sheet -->
  <script src="js/form.js"></script>                     <!-- draws the questions and sends the answers -->
  <script src="js/main.js"></script>                     <!-- starts everything -->
</body>
</html>
